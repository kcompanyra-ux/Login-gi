<!DOCTYPE html>
<html>
<head>
    <title>Firebase Login</title>
</head>
<body>
    <h1>Login System</h1>
    
    <!-- Sign Up Form -->
    <div id="signup-form">
        <h2>Sign Up</h2>
        <input type="email" id="signup-email" placeholder="Email">
        <input type="password" id="signup-password" placeholder="Password">
        <button onclick="signUp()">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- User Info (shown when logged in) -->
    <div id="user-info" style="display:none;">
        <p>Welcome, <span id="user-email"></span>!</p>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your web app's Firebase configuration
        // 👇👇👇 REPLACE THE VALUES BELOW WITH YOUR OWN FROM FIREBASE CONSOLE 👇👇👇
        const firebaseConfig = {
            apiKey: "AIzaSyB7LwM1oNVjfjs2fgdd9OOASBqkDm7DkK0",
            authDomain: "ticket-d2f30.firebaseapp.com",
            projectId: "ticket-d2f30",
            storageBucket: "ticket-d2f30.firebasestorage.app",
            messagingSenderId: "225223962663",
            appId: "1:225223962663:web:4e8e118ede45defaf61e02"
        };
        // 👆👆👆 REPLACE THE VALUES ABOVE WITH YOUR OWN FROM FIREBASE CONSOLE 👆👆👆

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- Authentication Functions ---
        
        window.signUp = async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('User created and logged in!');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('Logged in successfully!');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.logout = () => {
            signOut(auth).then(() => alert('Logged out!'));
        };

        // --- UI State Management ---
        
        // Listen for authentication state changes
        onAuthStateChanged(auth, (user) => {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const userInfo = document.getElementById('user-info');
            const userEmailSpan = document.getElementById('user-email');

            if (user) {
                // User is signed in
                loginForm.style.display = 'none';
                signupForm.style.display = 'none';
                userInfo.style.display = 'block';
                userEmailSpan.textContent = user.email;
            } else {
                // User is signed out
                loginForm.style.display = 'block';
                signupForm.style.display = 'block';
                userInfo.style.display = 'none';
            }
        });
    </script>
</body>
</html>
